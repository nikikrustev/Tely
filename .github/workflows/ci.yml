# OWNER: A (potencialbg). Needs no Azure credentials, ever: it installs pipeline/pyproject.toml only,
# never pipeline/requirements-azure.txt. Tests are found by folder (pipeline/tests/{a,b}, web/tests/{a,b}),
# so a new test file in either lane runs without editing this workflow.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: No Microsoft packages in B's pyproject (TEAM_SPLIT.md)
        run: |
          if grep -nEi '"(azure-|agent-framework|openai)' pyproject.toml; then
            echo "::error::Azure/Foundry/OpenAI packages belong in pipeline/requirements-azure.txt"; exit 1
          fi
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: No Microsoft packages in web/ (TEAM_SPLIT.md)
        run: |
          if grep -nE '"@azure/|"openai"' package.json; then
            echo "::error::@azure/* and openai packages are not allowed in web/package.json"; exit 1
          fi
      - run: npm run typecheck
      - run: npm test
