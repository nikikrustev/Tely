# OWNER: A (potencialbg). `azd up` in env "judge": the zero-backend replay on Static Web Apps Free (web), and from Stage 7
# the relay on Container Apps (live spoken questions through Voice Live, plus B's Stats MCP server at /mcp).
# Before deploying: python -m tely.build_bundle --cut judge (from pipeline/), so web/public/replay/v1/judge/ is
# current. The bundle is committed, so the web deploy needs no TTS and no keys; the relay hook needs Python + uv (D17).
# One-time: azd env set FOUNDRY_RESOURCE <name> (the Voice Live resource, D8; a name, not a secret).
name: tely
infra:
  provider: bicep
  path: infra
hooks:
  # The relay (Container Apps) is not an azd service: azd can only build images with ACR Tasks, which the free
  # subscription refuses, or local Docker, which A's machine lacks (docs/DECISIONS.md D17). relay/deploy.py builds the
  # same image as relay/Dockerfile without either, pushes it with az login, and points the Container App at it.
  predeploy:
    posix:
      shell: sh
      run: python3 -m relay.deploy
    windows:
      shell: pwsh
      run: python -m relay.deploy
services:
  web:
    project: ./web
    language: ts
    host: staticwebapp
    dist: dist        # vite build copies web/public/ (the replay bundle) into dist/
    hooks:
      # staticwebapp.config.json lives in web/ (TEAM_SPLIT.md) but must ship inside the deployed folder.
      # Whether azd would also pick it up from web/ on its own is (unverified); copying it is safe either way.
      # live.json tells the page where the relay is (lane-a/index.ts liveRelayUrl). RELAY_URL is a Bicep output.
      predeploy:
        posix:
          shell: sh
          run: cp staticwebapp.config.json dist/staticwebapp.config.json && printf '{"relay":"%s"}\n' "$RELAY_URL" > dist/live.json
        windows:
          shell: pwsh
          run: Copy-Item staticwebapp.config.json dist/staticwebapp.config.json -Force; Set-Content -Path dist/live.json -Value ('{"relay":"' + $env:RELAY_URL + '"}') -Encoding ascii
