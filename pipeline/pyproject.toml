# The pipeline package: generator, signals, commentary, agents, Q&A tools and evals.
# No Microsoft packages here: Azure deps live in requirements-azure.txt, which CI never installs.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tely"
version = "0.0.1"
description = "Tely: synthetic match, signals, commentary and Q&A for blind fans"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]   # movement.py only (element-wise maths; see its docstring)

[project.optional-dependencies]
dev = ["pytest>=9.1", "common-data-format-validator==0.1.1", "mcp==2.3.0"]   # CDF checker (MIT, file 26); MCP SDK (MIT)
mcp = ["mcp==2.3.0"]   # the Stats MCP server (qa/mcp_server.py, file 18); open protocol, not Microsoft

[tool.setuptools.packages.find]
include = ["tely*"]

[tool.pytest.ini_options]
# importlib mode: test files in different folders can share a basename without clashing,
# and neither folder needs an __init__.py. CI runs plain `pytest`, so new test files are found automatically.
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
